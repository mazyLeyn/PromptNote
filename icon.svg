<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dark Leather Background -->
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2c363f"/>
      <stop offset="70%" stop-color="#1e272e"/>
      <stop offset="100%" stop-color="#151b20"/>
    </radialGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2e2c0"/>
      <stop offset="40%" stop-color="#e5c07b"/>
      <stop offset="70%" stop-color="#c9a04e"/>
      <stop offset="100%" stop-color="#a07830"/>
    </linearGradient>

    <!-- Letter shadow -->
    <filter id="letterShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base: Dark Leather Rectangle -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Subtle leather stitching border -->
  <rect x="14" y="14" width="484" height="484" rx="90" fill="none" 
        stroke="rgba(229,192,123,0.12)" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Inner border -->
  <rect x="8" y="8" width="496" height="496" rx="94" fill="none" 
        stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>

  <!-- Centered Cursive "P" Letter -->
  <text x="256" y="280" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="260" 
        font-weight="400"
        font-style="italic"
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        dominant-baseline="central"
        filter="url(#letterShadow)">P</text>

  <!-- Subtle gold shine on letter -->
  <text x="255" y="279" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="260" 
        font-weight="400"
        font-style="italic"
        fill="none"
        stroke="rgba(255,255,255,0.06)"
        stroke-width="1"
        text-anchor="middle" 
        dominant-baseline="central">P</text>

  <!-- Small quill nib accent (bottom-right) -->
  <g transform="translate(380, 390) rotate(-45)" opacity="0.5">
    <rect x="0" y="0" width="5" height="28" rx="1" fill="url(#goldGrad)"/>
    <polygon points="0,28 5,28 2.5,40" fill="#a07830"/>
  </g>
</svg>
