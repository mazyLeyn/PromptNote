<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PromptNote - Vintage</title>
    <meta name="description" content="Vintage tasarımlı, zarif not alma uygulaması.">
    <meta name="theme-color" content="#1a1a1c">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">

    <!-- Sadece gerekli fontlar, display=swap ile -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Dark Background -->
    <div class="leather-desk">
        <div class="desk-vignette"></div>
    </div>

    <!-- App Header -->
    <header class="app-brand" id="app-brand">
        <span class="brand-text">PromptNote</span>
    </header>

    <div class="app-layout">
        <!-- Sidebar Toggle (Mobil) -->
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Not Defterini Aç/Kapat">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
        </button>

        <!-- Sol Sidebar -->
        <aside class="notebook-sidebar" id="sidebar">
            <div class="notebook-spine">
                <div class="spine-texture"></div>
                <div class="spine-bands">
                    <div class="band"></div>
                    <div class="band"></div>
                    <div class="band"></div>
                    <div class="band"></div>
                </div>
            </div>
            <div class="notebook-pages-edge"></div>
            <div class="notebook-paper">
                <div class="paper-texture"></div>
                <div class="paper-fold-shadow"></div>
                <div class="notes-container" id="notes-grid"></div>
            </div>
        </aside>

        <!-- Ana İçerik -->
        <main class="main-content">
            <div class="desk-center">
                <h1 class="cursive-title">Düşüncelerinizi Buraya Bırakın...</h1>

                <form id="note-form" class="leather-pouch" novalidate>
                    <div class="pouch-flap">
                        <div class="flap-stitching"></div>
                    </div>
                    <div class="pouch-body">
                        <div class="pouch-stitching"></div>
                        <div class="pouch-inner">
                            <textarea id="note-input" class="gold-input" placeholder="Büyük fikirlerini buraya yaz..."
                                rows="1" autofocus autocomplete="off" spellcheck="false"></textarea>
                            <button type="submit" id="add-btn" class="gold-btn" aria-label="Not Ekle">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="wax-seal">
                        <div class="seal-inner">
                            <span class="seal-letter">P</span>
                        </div>
                    </div>
                </form>

                <!-- Masaüstü dekorasyon -->
                <div class="deco-nib deco-nib-left" aria-hidden="true">
                    <div class="nib-body"></div>
                    <div class="nib-tip"></div>
                    <div class="nib-ring"></div>
                </div>
                <div class="deco-nib deco-nib-right" aria-hidden="true">
                    <div class="nib-body"></div>
                    <div class="nib-tip"></div>
                    <div class="nib-ring"></div>
                </div>
                <div class="deco-sketch" aria-hidden="true">
                    <div class="sketch-lines">
                        <svg viewBox="0 0 120 90" fill="none" stroke="rgba(80,60,30,0.4)" stroke-width="0.7">
                            <rect x="10" y="15" width="40" height="55" rx="2" />
                            <circle cx="80" cy="40" r="20" />
                            <line x1="60" y1="70" x2="110" y2="70" />
                            <line x1="15" y1="80" x2="55" y2="80" />
                            <line x1="70" y1="15" x2="95" y2="15" />
                            <path d="M30 35 L40 25 L50 35" />
                            <circle cx="30" cy="50" r="5" />
                        </svg>
                    </div>
                </div>
            </div>
        </main>

        <div id="mobile-overlay" class="mobile-overlay"></div>
    </div>

    <!-- Ink Canvas (masaüstü) -->
    <canvas id="ink-canvas" class="ink-canvas" aria-hidden="true"></canvas>

    <!-- Parçacık Konteyneri -->
    <div id="particle-container" class="particle-container" aria-hidden="true"></div>

    <!-- Kalem -->
    <div class="fidget-pen" id="fidget-pen" title="Beni sürükle! ✍️" aria-hidden="true">
        <div class="pen-cap">
            <div class="pen-cap-band"></div>
            <div class="pen-clip"></div>
        </div>
        <div class="pen-barrel">
            <div class="pen-barrel-band"></div>
        </div>
        <div class="pen-grip"></div>
        <div class="pen-nib-section">
            <div class="pen-nib"></div>
            <div class="pen-nib-tip"></div>
        </div>
    </div>

    <!-- Yıldız -->
    <div class="sparkle-star" id="sparkle-star" title="Tıkla! ✨" role="button" tabindex="0" aria-label="Işıltı efekti">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 2L13.5 9.5L21 8L14.5 12L18 19L12 14.5L6 19L9.5 12L3 8L10.5 9.5L12 2Z" fill="none"
                stroke="rgba(229,192,123,0.5)" stroke-width="1" stroke-linejoin="round" />
        </svg>
    </div>

    <div class="fidget-hint" id="fidget-hint" aria-hidden="true">
        <span>🖊️ Kalemi sürükle, mühürü çevir, yıldıza tıkla!</span>
    </div>

    <!-- defer ile geciktir, DOM hazır olana kadar bekle -->
    <script src="app.js" defer></script>
</body>

</html>
